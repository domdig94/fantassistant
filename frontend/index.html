<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FantAssistant — Asta Live</title>
<style>
  :root {
    --bg: #0d0f14;
    --panel: #161922;
    --panel-2: #1d212c;
    --line: #2a2f3d;
    --text: #e9ebf0;
    --muted: #868da0;
    --pitch: #2f9e5e;
    --pitch-dim: #1d3d2c;
    --amber: #e0a339;
    --red: #e0524f;
    --mono: 'SF Mono', 'JetBrains Mono', Consolas, monospace;
    --sans: -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }
  header {
    padding: 20px 28px 16px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
    letter-spacing: 0.02em;
  }
  header h1 span { color: var(--pitch); }
  .status {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
  }

  /* Scoreboard budget */
  .scoreboard {
    display: flex;
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    margin: 20px 28px;
    border-radius: 6px;
    overflow: hidden;
  }
  .chip {
    flex: 1;
    background: var(--panel);
    padding: 14px 16px;
    min-width: 110px;
  }
  .chip .ruolo {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .chip .valore {
    font-family: var(--mono);
    font-size: 24px;
    font-weight: 600;
    margin-top: 4px;
  }
  .chip .valore.low { color: var(--red); }
  .chip .sotto { font-size: 11px; color: var(--muted); margin-top: 2px; }

  main {
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 20px;
    padding: 0 28px 28px;
  }
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 18px;
  }
  .panel h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 14px;
  }

  input, select {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 5px;
    font-size: 14px;
    font-family: var(--sans);
  }
  input:focus, select:focus { outline: 1px solid var(--pitch); border-color: var(--pitch); }
  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 5px; }
  label:first-of-type { margin-top: 0; }

  .risultati-ricerca {
    margin-top: 6px;
    border: 1px solid var(--line);
    border-radius: 5px;
    max-height: 180px;
    overflow-y: auto;
    display: none;
  }
  .risultati-ricerca.show { display: block; }
  .risultato-item {
    padding: 9px 12px;
    cursor: pointer;
    font-size: 13px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
  }
  .risultato-item:last-child { border-bottom: none; }
  .risultato-item:hover { background: var(--panel-2); }
  .risultato-item .r-nome { font-weight: 500; }
  .risultato-item .r-info { color: var(--muted); font-family: var(--mono); font-size: 12px; }

  .selezionato {
    margin-top: 10px;
    padding: 10px 12px;
    background: var(--pitch-dim);
    border: 1px solid var(--pitch);
    border-radius: 5px;
    font-size: 13px;
    display: none;
  }
  .selezionato.show { display: block; }

  .row-flag {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
  }
  .row-flag input[type="checkbox"] { width: auto; }
  .row-flag label { margin: 0; color: var(--text); font-size: 13px; }

  button {
    width: 100%;
    margin-top: 16px;
    padding: 12px;
    background: var(--pitch);
    color: #08120c;
    border: none;
    border-radius: 5px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }

  .msg { margin-top: 10px; font-size: 13px; font-family: var(--mono); }
  .msg.ok { color: var(--pitch); }
  .msg.err { color: var(--red); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left;
    color: var(--muted);
    font-weight: 500;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
  }
  td { padding: 9px 10px; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: none; }
  .badge-mio {
    display: inline-block;
    font-family: var(--mono);
    font-size: 10px;
    padding: 2px 6px;
    background: var(--pitch-dim);
    color: var(--pitch);
    border-radius: 3px;
    margin-left: 6px;
  }
  .prezzo { font-family: var(--mono); font-weight: 600; }
  .vuoto { color: var(--muted); font-size: 13px; padding: 20px 0; text-align: center; }

  .chat-panel {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    height: 340px;
  }
  .chat-log {
    flex: 1;
    overflow-y: auto;
    padding: 4px 2px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .chat-msg { max-width: 85%; font-size: 13px; line-height: 1.5; }
  .chat-msg.utente {
    align-self: flex-end;
    background: var(--pitch-dim);
    border: 1px solid var(--pitch);
    padding: 8px 12px;
    border-radius: 8px 8px 2px 8px;
  }
  .chat-msg.bot {
    align-self: flex-start;
    background: var(--panel-2);
    border: 1px solid var(--line);
    padding: 8px 12px;
    border-radius: 8px 8px 8px 2px;
    white-space: pre-wrap;
  }
  .chat-msg.loading { color: var(--muted); font-family: var(--mono); font-size: 12px; }
  .chat-input-row { display: flex; gap: 8px; margin-top: 12px; }
  .chat-input-row input { flex: 1; }
  .chat-input-row button { width: auto; margin-top: 0; padding: 10px 18px; }

  .storico-controls {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .storico-controls input { flex: 1; }
  .storico-wrapper {
    max-height: 340px;
    overflow-y: auto;
    border: 1px solid var(--line);
    border-radius: 5px;
  }
  .storico-wrapper table { border: none; }
  .storico-wrapper thead th {
    position: sticky;
    top: 0;
    background: var(--panel-2);
    cursor: pointer;
    user-select: none;
  }
  .storico-wrapper thead th:hover { color: var(--text); }
  .storico-wrapper thead th.sort-attivo { color: var(--pitch); }
  .sort-arrow { font-size: 9px; margin-left: 3px; }
</style>
</head>
<body>

<header>
  <h1>Fant<span>Assistant</span> — Asta Live</h1>
  <div class="status" id="status">connessione...</div>
  <a href="analytics.html" style="font-size:13px; color:var(--muted); text-decoration:none;">Analytics →</a>
</header>

<div class="scoreboard" id="scoreboard"></div>

<main>
  <div class="panel">
    <h2>Registra acquisto</h2>

    <label for="ricerca">Cerca giocatore</label>
    <input type="text" id="ricerca" placeholder="Nome giocatore..." autocomplete="off">
    <div class="risultati-ricerca" id="risultati"></div>
    <div class="selezionato" id="selezionato"></div>

    <label for="prezzo">Prezzo pagato</label>
    <input type="number" id="prezzo" placeholder="0" min="1" step="1"
      onkeydown="return event.key !== 'e' && event.key !== '-' && event.key !== '+' && event.key !== '.' && event.key !== ','"
      oninput="this.value = this.value.replace(/[^0-9]/g, ''); if(this.value < 1 && this.value !== '') this.value = '';">

    <label for="squadraAcquirente">Squadra acquirente</label>
    <select id="squadraAcquirente"><option value="">Seleziona...</option></select>

    <div class="row-flag">
      <input type="checkbox" id="eMio">
      <label for="eMio">È mio (va nella mia rosa)</label>
    </div>

    <button id="btnRegistra" disabled>Registra acquisto</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="panel">
    <h2>Storico live</h2>
    <div class="storico-controls">
      <input type="text" id="filtroStorico" placeholder="Filtra per giocatore o squadra..." autocomplete="off">
    </div>
    <div class="storico-wrapper">
      <table id="tabellaStorico">
        <thead>
          <tr>
            <th data-campo="nome">Giocatore<span class="sort-arrow"></span></th>
            <th data-campo="ruolo">Ruolo<span class="sort-arrow"></span></th>
            <th data-campo="prezzo_finale">Prezzo<span class="sort-arrow"></span></th>
            <th data-campo="squadra_acquirente">Squadra<span class="sort-arrow"></span></th>
            <th data-campo="creato_il">Ora<span class="sort-arrow"></span></th>
          </tr>
        </thead>
        <tbody id="corpoStorico"></tbody>
      </table>
    </div>
    <div class="vuoto" id="vuoto" style="display:none;">Ancora nessun acquisto registrato</div>
  </div>
</main>

<div style="padding: 0 28px 28px;">
  <div class="panel chat-panel">
    <h2>Chiedi al chatbot</h2>
    <div class="chat-log" id="chatLog"></div>
    <div class="chat-input-row">
      <input type="text" id="chatInput" placeholder="Es: chi conviene con 30 crediti residui tra i difensori liberi?">
      <button id="btnChatSend" style="background: var(--panel-2); color: var(--text); border: 1px solid var(--line);">Chiedi</button>
    </div>
  </div>
</div>

<script>
  const API = 'http://localhost:8002';
  let giocatoreSelezionato = null;
  let chatHistory = [];
  let timerRicerca = null;

  async function caricaBudget() {
    try {
      const res = await fetch(`${API}/squadre`);
      const data = await res.json();
      const scoreboard = document.getElementById('scoreboard');
      const select = document.getElementById('squadraAcquirente');
      const valoreAttuale = select.value;

      scoreboard.innerHTML = '';
      select.innerHTML = '<option value="">Seleziona...</option>';

      if (!data.squadre.length) {
        scoreboard.innerHTML = '<div class="chip"><div class="ruolo">Squadre</div><div class="valore" style="font-size:14px; color: var(--muted);">non ancora censite</div></div>';
        return;
      }

      data.squadre.forEach(s => {
        const low = s.budget_residuo < s.budget_totale * 0.15;
        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.innerHTML = `
          <div class="ruolo">${s.nome}</div>
          <div class="valore ${low ? 'low' : ''}">${s.budget_residuo}</div>
          <div class="sotto">su ${s.budget_totale}</div>
        `;
        scoreboard.appendChild(chip);

        const opt = document.createElement('option');
        opt.value = s.nome;
        opt.textContent = s.nome;
        select.appendChild(opt);
      });

      select.value = valoreAttuale;
    } catch (e) {
      document.getElementById('status').textContent = 'backend non raggiungibile';
    }
  }

  let storicoCompleto = [];
  let ordinamento = { campo: 'creato_il', direzione: 'desc' };

  async function caricaStorico() {
    try {
      const res = await fetch(`${API}/storico?limit=100`);
      const data = await res.json();
      storicoCompleto = data.storico;
      document.getElementById('status').textContent = `connesso — ${storicoCompleto.length} acquisti`;
      renderStorico();
    } catch (e) {
      document.getElementById('status').textContent = 'backend non raggiungibile';
    }
  }

  function renderStorico() {
    const filtro = document.getElementById('filtroStorico').value.trim().toLowerCase();
    let righe = storicoCompleto.filter(s =>
      !filtro || s.nome.toLowerCase().includes(filtro) || s.squadra_acquirente.toLowerCase().includes(filtro)
    );

    righe.sort((a, b) => {
      let va = a[ordinamento.campo], vb = b[ordinamento.campo];
      if (ordinamento.campo === 'prezzo_finale') { va = Number(va); vb = Number(vb); }
      if (va < vb) return ordinamento.direzione === 'asc' ? -1 : 1;
      if (va > vb) return ordinamento.direzione === 'asc' ? 1 : -1;
      return 0;
    });

    const corpo = document.getElementById('corpoStorico');
    const vuoto = document.getElementById('vuoto');
    corpo.innerHTML = '';

    if (!righe.length) {
      vuoto.style.display = 'block';
    } else {
      vuoto.style.display = 'none';
      righe.forEach(s => {
        const ora = new Date(s.creato_il).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${s.nome}</td>
          <td>${s.ruolo}</td>
          <td class="prezzo">${s.prezzo_finale}</td>
          <td>${s.squadra_acquirente}${s.fonte === 'manuale' ? '' : `<span class="badge-mio">${s.fonte}</span>`}</td>
          <td>${ora}</td>
        `;
        corpo.appendChild(tr);
      });
    }

    document.querySelectorAll('.storico-wrapper th').forEach(th => {
      const arrow = th.querySelector('.sort-arrow');
      if (th.dataset.campo === ordinamento.campo) {
        th.classList.add('sort-attivo');
        arrow.textContent = ordinamento.direzione === 'asc' ? '▲' : '▼';
      } else {
        th.classList.remove('sort-attivo');
        arrow.textContent = '';
      }
    });
  }

  document.querySelectorAll('.storico-wrapper th').forEach(th => {
    th.addEventListener('click', () => {
      const campo = th.dataset.campo;
      if (ordinamento.campo === campo) {
        ordinamento.direzione = ordinamento.direzione === 'asc' ? 'desc' : 'asc';
      } else {
        ordinamento = { campo, direzione: 'asc' };
      }
      renderStorico();
    });
  });

  document.getElementById('filtroStorico').addEventListener('input', renderStorico);

  document.getElementById('ricerca').addEventListener('input', (e) => {
    clearTimeout(timerRicerca);
    const val = e.target.value.trim();
    document.getElementById('risultati').classList.remove('show');
    giocatoreSelezionato = null;
    aggiornaBottone();
    if (val.length < 2) return;

    timerRicerca = setTimeout(async () => {
      const res = await fetch(`${API}/cerca-giocatori?nome=${encodeURIComponent(val)}`);
      const data = await res.json();
      const box = document.getElementById('risultati');
      box.innerHTML = '';
      if (!data.risultati.length) {
        box.innerHTML = '<div class="risultato-item"><span class="r-info">Nessun giocatore libero trovato</span></div>';
        box.classList.add('show');
        return;
      }
      data.risultati.forEach(g => {
        const item = document.createElement('div');
        item.className = 'risultato-item';
        item.innerHTML = `<span class="r-nome">${g.nome}</span><span class="r-info">${g.ruolo} · ${g.squadra} · FVM ${g.fvm ?? '-'}</span>`;
        item.onclick = () => selezionaGiocatore(g);
        box.appendChild(item);
      });
      box.classList.add('show');
    }, 250);
  });

  function selezionaGiocatore(g) {
    giocatoreSelezionato = g;
    document.getElementById('risultati').classList.remove('show');
    document.getElementById('ricerca').value = g.nome;
    const sel = document.getElementById('selezionato');
    sel.textContent = `${g.nome} — ${g.ruolo}, ${g.squadra} (quot. ${g.quotazione_attuale}, FVM ${g.fvm ?? '-'})`;
    sel.classList.add('show');
    aggiornaBottone();
  }

  function aggiornaBottone() {
    const prezzo = document.getElementById('prezzo').value;
    const squadra = document.getElementById('squadraAcquirente').value.trim();
    document.getElementById('btnRegistra').disabled = !(giocatoreSelezionato && prezzo && squadra);
  }
  document.getElementById('prezzo').addEventListener('input', aggiornaBottone);
  document.getElementById('squadraAcquirente').addEventListener('input', aggiornaBottone);

  document.getElementById('btnRegistra').addEventListener('click', async () => {
    const msg = document.getElementById('msg');
    const btn = document.getElementById('btnRegistra');
    btn.disabled = true;
    msg.textContent = '';
    msg.className = 'msg';

    try {
      const res = await fetch(`${API}/acquisto`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          giocatore_id: giocatoreSelezionato.id,
          prezzo_finale: parseFloat(document.getElementById('prezzo').value),
          squadra_acquirente: document.getElementById('squadraAcquirente').value.trim(),
          e_mio: document.getElementById('eMio').checked,
          fonte: 'manuale',
        }),
      });
      if (!res.ok) {
        const errBody = await res.json().catch(() => ({}));
        throw new Error(errBody.detail || `HTTP ${res.status}`);
      }

      msg.textContent = `✓ ${giocatoreSelezionato.nome} registrato`;
      msg.className = 'msg ok';

      // reset form
      giocatoreSelezionato = null;
      document.getElementById('ricerca').value = '';
      document.getElementById('prezzo').value = '';
      document.getElementById('eMio').checked = false;
      document.getElementById('selezionato').classList.remove('show');

      await caricaBudget();
      await caricaStorico();
    } catch (e) {
      msg.textContent = `✗ Errore: ${e.message}`;
      msg.className = 'msg err';
    } finally {
      aggiornaBottone();
    }
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('#ricerca') && !e.target.closest('#risultati')) {
      document.getElementById('risultati').classList.remove('show');
    }
  });

  const CHATBOT_API = 'http://localhost:8000';

  function aggiungiMessaggioChat(testo, tipo) {
    const log = document.getElementById('chatLog');
    const div = document.createElement('div');
    div.className = `chat-msg ${tipo}`;
    div.textContent = testo;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  async function inviaDomandaChat() {
    const input = document.getElementById('chatInput');
    const domanda = input.value.trim();
    if (!domanda) return;

    aggiungiMessaggioChat(domanda, 'utente');
    input.value = '';
    const loadingEl = aggiungiMessaggioChat('...sto pensando', 'bot loading');

    document.getElementById('btnChatSend').disabled = true;
    try {
      const res = await fetch(`${CHATBOT_API}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ domanda, modalita: 'asta', storico: chatHistory }),
      });
      const data = await res.json();
      loadingEl.textContent = data.risposta;
      loadingEl.className = 'chat-msg bot';

      chatHistory.push({ role: 'user', content: domanda });
      chatHistory.push({ role: 'assistant', content: data.risposta });
      // tieni solo gli ultimi 20 messaggi, per non far crescere il payload
      // all'infinito durante una sessione lunga come un'asta
      if (chatHistory.length > 20) chatHistory = chatHistory.slice(-20);
    } catch (e) {
      loadingEl.textContent = `Errore: backend chatbot non raggiungibile (${e.message})`;
      loadingEl.className = 'chat-msg bot';
    } finally {
      document.getElementById('btnChatSend').disabled = false;
    }
  }

  document.getElementById('btnChatSend').addEventListener('click', inviaDomandaChat);
  document.getElementById('chatInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') inviaDomandaChat();
  });

  caricaBudget();
  caricaStorico();
  setInterval(() => { caricaBudget(); caricaStorico(); }, 8000);
</script>

</body>
</html>
